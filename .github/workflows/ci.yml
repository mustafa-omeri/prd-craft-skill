name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Engine parity is checked on a WINDOWS runner, where both engines exist and the
# result matches what a contributor on Windows will actually see. validate.ps1
# builds paths with backslashes, which is verified behaviour on Windows only —
# it is not claimed to work on the Linux runner image.
jobs:
  validate-pwsh:
    name: Structure checks (pwsh 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: validate.ps1
        shell: pwsh
        run: |
          ./validate.ps1
          if ($LASTEXITCODE -ne 0) { throw "validate.ps1 failed on pwsh 7" }

  validate-ps51:
    name: Structure checks (Windows PowerShell 5.1 — engine parity)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: validate.ps1
        shell: cmd
        run: |
          .\validate.ps1
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

  evals:
    name: Eval definitions (L0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # L0 is automatic and deterministic, so it runs here.
      # L1 is interactive and human-graded, so it cannot — see CONTRIBUTING.md.
      # The runner exits non-zero on failure and bash runs with -e, so the step
      # fails on its own. Do not add PowerShell syntax to a bash step.
      - name: run-evals.mjs --selftest
        run: node ./evals/run-evals.mjs --selftest

  installer:
    name: Installer smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install.sh --dry-run
        run: |
          chmod +x ./install.sh
          ./install.sh --dry-run user

      # An installer that silently copies nothing is worse than no installer.
      - name: install into a scratch directory
        run: |
          set -euo pipefail
          SCRATCH="$(mktemp -d)"
          ./install.sh project "$SCRATCH"
          test -f "$SCRATCH/.agents/skills/prd-craft/SKILL.md"
          test -f "$SCRATCH/.agents/skills/kvkk-publish-review/SKILL.md"
          test -f "$SCRATCH/.agents/skills/ROUTING.md"
          echo "the installed skill set is complete"

  linecount:
    name: SKILL.md size limit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Progressive disclosure only works while SKILL.md stays small enough to sit
      # in an agent's context window.
      - name: report line counts
        run: |
          set -euo pipefail
          status=0
          for f in prd-craft/SKILL.md kvkk-publish-review/SKILL.md; do
            n=$(wc -l < "$f")
            echo "$f: $n lines"
            if [ "$n" -gt 500 ]; then
              echo "::warning::$f is $n lines, over the 500-line budget"
              status=1
            fi
          done
          exit $status