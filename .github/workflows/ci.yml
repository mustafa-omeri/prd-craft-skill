name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Structure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PowerShell
        uses: actions/setup-powershell@v4
        with:
          shell-version: '7.4'

      # Both engines must agree. A difference means an encoding bug, not a logic
      # bug: Windows PowerShell reads a BOM-less file as ANSI.
      - name: validate.ps1 (pwsh 7)
        shell: pwsh
        run: |
          ./validate.ps1
          if ($LASTEXITCODE -ne 0) { throw "validate.ps1 failed on pwsh" }

      - name: validate.ps1 (windows powershell 5.1 — engine parity)
        shell: powershell
        run: |
          .\validate.ps1
          if ($LASTEXITCODE -ne 0) { throw "validate.ps1 failed on powershell 5.1" }

  evals:
    name: Eval definitions (L0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # L0 is automatic and deterministic. L1 is interactive and human-graded,
      # so it cannot run here — see CONTRIBUTING.md.
      - name: run-evals.mjs --selftest
        run: |
          node ./evals/run-evals.mjs --selftest
          if ($LASTEXITCODE -ne 0) { throw "L0 eval definitions failed" }

  installer:
    name: Installer smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # An installer that silently copies nothing is worse than no installer.
      - name: install.sh --dry-run
        run: |
          chmod +x ./install.sh
          ./install.sh --dry-run project

      - name: install.sh into a scratch directory
        run: |
          set -euo pipefail
          SCRATCH="$(mktemp -d)"
          ./install.sh project "$SCRATCH"
          test -f "$SCRATCH/.agents/skills/prd-craft/SKILL.md"
          test -f "$SCRATCH/.agents/skills/kvkk-publish-review/SKILL.md"
          test -f "$SCRATCH/.agents/skills/ROUTING.md"
          echo "installed skill set is complete"

  linecount:
    name: SKILL.md size limit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Progressive disclosure only works if SKILL.md stays small enough to sit
      # in an agent's context. Reported as a warning, not a hard failure, so a
      # legitimate change is a conscious decision rather than a silent drift.
      - name: report line counts
        run: |
          set -euo pipefail
          status=0
          for f in prd-craft/SKILL.md kvkk-publish-review/SKILL.md; do
            n=$(wc -l < "$f")
            echo "$f: $n lines"
            if [ "$n" -gt 500 ]; then
              echo "::warning::$f is $n lines, over the 500-line budget"
              status=1
            fi
          done
          exit $status